<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NHL in 5</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08111f;
      color: #f8fafc;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 42px 20px 80px;
    }

    h1 {
      font-size: 48px;
      margin: 0;
      letter-spacing: -1.5px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 18px;
      margin-top: 8px;
      margin-bottom: 38px;
    }

    section {
      margin-bottom: 42px;
    }

    .section-title {
      font-size: 27px;
      margin-bottom: 18px;
    }

    .panel {
      background: #121d30;
      border-radius: 18px;
      padding: 22px;
    }

    /* -------------------------
       YESTERDAY
    -------------------------- */

    .games {
      display: grid;
      gap: 15px;
    }

    .game-card {
      background: #0c1627;
      border-radius: 15px;
      padding: 22px 24px;
    }

    .score-line {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin-bottom: 13px;
    }

    .winner {
      color: #ffffff;
    }

    .loser {
      color: #b7c2d2;
    }

    .dash {
      color: #64748b;
    }

    .game-type {
      font-size: 12px;
      color: #94a3b8;
      background: #162238;
      border-radius: 999px;
      padding: 4px 8px;
      letter-spacing: .4px;
      font-weight: 700;
    }

    .performer {
      font-size: 16px;
      color: #e2e8f0;
      margin-bottom: 14px;
    }

    .performer-name {
      font-weight: 700;
      color: #ffffff;
    }

    .streaks {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #121f33;
      color: #cbd5e1;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 14px;
    }

    .streak-team {
      font-weight: 650;
    }

    /* -------------------------
       STANDINGS
    -------------------------- */

    .conferences {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .conference {
      background: #121d30;
      border-radius: 18px;
      padding: 20px;
    }

    .conference-title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .division {
      margin-bottom: 27px;
    }

    .division:last-child {
      margin-bottom: 0;
    }

    .division-title {
      text-transform: uppercase;
      color: #64748b;
      font-size: 12px;
      letter-spacing: 1.4px;
      margin-bottom: 7px;
      font-weight: 700;
    }

    .standing-header {
      display: grid;
      grid-template-columns:
        28px
        1fr
        95px
        50px
        48px;

      align-items: center;
      padding: 0 0 7px;
      color: #64748b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .header-right {
      text-align: right;
    }

    .standing-row {
      display: grid;
      grid-template-columns:
        28px
        1fr
        95px
        50px
        48px;

      align-items: center;
      padding: 8px 0;
      border-bottom:
        1px solid rgba(255,255,255,.06);
      font-size: 14px;
    }

    .standing-row:last-child {
      border-bottom: none;
    }

    .rank {
      color: #64748b;
      font-size: 12px;
    }

    .team {
      font-weight: 700;
    }

    .record {
      color: #94a3b8;
      text-align: right;
    }

    .points {
      text-align: right;
      font-weight: 800;
    }

    .movement {
      text-align: right;
      font-weight: 800;
    }

    .up {
      color: #4ade80;
    }

    .down {
      color: #fb7185;
    }

    .same {
      color: #64748b;
    }

    /* -------------------------
       UPCOMING
    -------------------------- */

    .upcoming-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .upcoming-card {
      background: #0c1627;
      border-radius: 13px;
      padding: 17px;
    }

    .upcoming-matchup {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .upcoming-time {
      color: #94a3b8;
      font-size: 14px;
    }

    .loading,
    .error {
      color: #94a3b8;
      padding: 10px 0;
    }

    /* -------------------------
       MOBILE
    -------------------------- */

    @media (max-width: 750px) {

      .container {
        padding-top: 28px;
      }

      h1 {
        font-size: 39px;
      }

      .conferences {
        grid-template-columns: 1fr;
      }

      .score-line {
        font-size: 25px;
      }

      .standing-header {
        grid-template-columns:
          25px
          1fr
          82px
          45px
          42px;
      }

      .standing-row {
        grid-template-columns:
          25px
          1fr
          82px
          45px
          42px;
      }

      .record {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>NHL in 5</h1>

  <div class="subtitle">
    Everything you need to know in five minutes.
  </div>

  <!-- YESTERDAY -->

  <section>

    <h2 class="section-title">
      Yesterday
    </h2>

    <div class="panel">

      <div id="games" class="games">
        <div class="loading">
          Loading yesterday's games...
        </div>
      </div>

    </div>

  </section>

  <!-- STANDINGS -->

  <section>

    <h2 class="section-title">
      Standings
    </h2>

    <div id="standings">

      <div class="loading">
        Loading standings...
      </div>

    </div>

  </section>

  <!-- UPCOMING -->

  <section>

    <h2 class="section-title">
      Up Next
    </h2>

    <div class="panel">

      <div
        id="upcoming"
        class="upcoming-grid"
      >

        <div class="loading">
          Loading upcoming games...
        </div>

      </div>

    </div>

  </section>

</div>

<script>

let teamNames = {};


async function loadDashboard() {

  try {

    const response = await fetch(
      "/.netlify/functions/nhl-scores"
    );

    if (!response.ok) {
      throw new Error(
        "Could not load NHL data."
      );
    }

    const data = await response.json();


    teamNames = {};

    (data.standings || []).forEach(team => {

      teamNames[team.abbrev] =
        team.location ||
        team.name ||
        team.abbrev;

    });


    renderGames(
      data.games || []
    );

    renderStandings(
      data.standings || []
    );

    renderUpcoming(
      data.upcoming || []
    );

  } catch (error) {

    console.error(error);

    document.getElementById(
      "games"
    ).innerHTML =
      '<div class="error">Could not load NHL data.</div>';

    document.getElementById(
      "standings"
    ).innerHTML =
      '<div class="error">Could not load standings.</div>';

    document.getElementById(
      "upcoming"
    ).innerHTML =
      '<div class="error">Could not load upcoming games.</div>';

  }
}


/* --------------------------------
   YESTERDAY
-------------------------------- */

function renderGames(games) {

  const container =
    document.getElementById("games");

  container.innerHTML = "";


  if (!games.length) {

    container.innerHTML =
      "<div>No NHL games were played yesterday.</div>";

    return;
  }


  games.forEach(game => {

    const card =
      document.createElement("div");

    card.className =
      "game-card";


    const awayWon =
      game.away.score >
      game.home.score;

    const homeWon =
      game.home.score >
      game.away.score;


    const awayClass =
      awayWon
        ? "winner"
        : "loser";

    const homeClass =
      homeWon
        ? "winner"
        : "loser";


    let gameType = "";

    if (game.periodType === "OT") {

      gameType =
        `<span class="game-type">
          OT
        </span>`;

    }

    if (game.periodType === "SO") {

      gameType =
        `<span class="game-type">
          SO
        </span>`;

    }


    let performerText =
      "Player stats unavailable";


    if (game.topPerformer) {

      performerText = `

        🏒

        <span class="performer-name">
          ${game.topPerformer.name}
        </span>

        (${game.topPerformer.team})

        —

        ${game.topPerformer.goals} G,
        ${game.topPerformer.assists} A

      `;

    }


    card.innerHTML = `

      <div class="score-line">

        <span class="${awayClass}">
          ${game.away.location}
          ${game.away.score}
        </span>

        <span class="dash">
          —
        </span>

        <span class="${homeClass}">
          ${game.home.location}
          ${game.home.score}
        </span>

        ${gameType}

      </div>


      <div class="performer">

        ${performerText}

      </div>


      <div class="streaks">

        ${streakHTML(
          game.away.abbrev,
          game.away.streak
        )}

        ${streakHTML(
          game.home.abbrev,
          game.home.streak
        )}

      </div>

    `;


    container.appendChild(card);

  });

}



function streakHTML(
  abbrev,
  streak
) {

  const team =
    teamNames[abbrev] ||
    abbrev;


  if (
    !streak ||
    !streak.code
  ) {

    return `

      <span class="streak-pill">

        <span class="streak-team">
          ${team}
        </span>

        —

      </span>

    `;

  }


  const emoji =
    streak.emoji ||
    "•";


  return `

    <span class="streak-pill">

      ${emoji}

      <span class="streak-team">
        ${team}
      </span>

      ${streak.code}${streak.count}

    </span>

  `;

}


/* --------------------------------
   STANDINGS
-------------------------------- */

function renderStandings(standings) {

  const container =
    document.getElementById(
      "standings"
    );


  const east =
    standings.filter(
      team =>
        team.conference
          .toLowerCase()
          .includes("east")
    );


  const west =
    standings.filter(
      team =>
        team.conference
          .toLowerCase()
          .includes("west")
    );


  container.innerHTML = `

    <div class="conferences">

      ${conferenceHTML(
        "Eastern Conference",
        east,
        [
          "Atlantic",
          "Metropolitan"
        ]
      )}

      ${conferenceHTML(
        "Western Conference",
        west,
        [
          "Central",
          "Pacific"
        ]
      )}

    </div>

  `;

}



function conferenceHTML(
  conferenceName,
  teams,
  divisionNames
) {

  let html = `

    <div class="conference">

      <div class="conference-title">
        ${conferenceName}
      </div>

  `;


  divisionNames.forEach(
    divisionName => {

      const divisionTeams =
        teams
          .filter(
            team =>
              team.division ===
              divisionName
          )
          .sort(
            (a,b) =>
              a.divisionRank -
              b.divisionRank
          );


      html += `

        <div class="division">

          <div class="division-title">
            ${divisionName}
          </div>

          <div class="standing-header">
            <div>RK</div>
            <div>TEAM</div>
            <div class="header-right">RECORD</div>
            <div class="header-right">PTS</div>
            <div class="header-right">MOVE</div>
          </div>

      `;


      divisionTeams.forEach(
        (team, index) => {

          html +=
            standingRowHTML(
              team,
              index + 1
            );

        }
      );


      html += `
        </div>
      `;

    }
  );


  html += `
    </div>
  `;


  return html;

}



function standingRowHTML(
  team,
  rank
) {

  let movementHTML =
    `<span class="same">—</span>`;


  if (team.movement > 0) {

    movementHTML = `

      <span class="up">
        ↑${team.movement}
      </span>

    `;

  }


  if (team.movement < 0) {

    movementHTML = `

      <span class="down">
        ↓${Math.abs(team.movement)}
      </span>

    `;

  }


  return `

    <div class="standing-row">

      <div class="rank">
        ${rank}
      </div>

      <div class="team">
        ${team.abbrev}
      </div>

      <div class="record">
        ${team.wins}-${team.losses}-${team.otLosses}
      </div>

      <div class="points">
        ${team.points}
      </div>

      <div class="movement">
        ${movementHTML}
      </div>

    </div>

  `;

}


/* --------------------------------
   UPCOMING
-------------------------------- */

function renderUpcoming(games) {

  const container =
    document.getElementById(
      "upcoming"
    );


  container.innerHTML = "";


  if (!games.length) {

    container.innerHTML =
      "<div>No upcoming games found.</div>";

    return;

  }


  games.forEach(game => {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "upcoming-card";


    const date =
      new Date(
        game.startTimeUTC
      );


    const dateLabel =
      date.toLocaleDateString(
        undefined,
        {
          weekday: "short",
          month: "short",
          day: "numeric"
        }
      );


    const timeLabel =
      date.toLocaleTimeString(
        undefined,
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );


    card.innerHTML = `

      <div class="upcoming-matchup">

        ${game.awayLocation}
        @
        ${game.homeLocation}

      </div>

      <div class="upcoming-time">

        ${dateLabel}
        •
        ${timeLabel}

      </div>

    `;


    container.appendChild(
      card
    );

  });

}


loadDashboard();

</script>

</body>
</html>
